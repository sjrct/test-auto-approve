name: Auto approve
on: pull_request_target

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            outside:
              - '!examples/**'
              - '!data/**'
      - if: steps.filter.outputs.outside == 'false'
        uses: hmarr/auto-approve-action@v4
